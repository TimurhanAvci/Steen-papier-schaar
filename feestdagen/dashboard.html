<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urenregistratie - Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f4f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .dashboard {
      background: #ffffff;
      border-radius: 16px;
      padding: 2rem;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #1a1a18;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: 14px;
      color: #888780;
      margin-bottom: 2rem;
    }

    h2 {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a18;
      margin-bottom: 1rem;
    }

    .feestdag-lijst {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .feestdag-item {
      background: #f5f4f0;
      border-radius: 10px;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .feestdag-naam {
      font-size: 15px;
      font-weight: 500;
      color: #1a1a18;
    }

    .feestdag-datum {
      font-size: 13px;
      color: #888780;
    }

    .dagen-badge {
      background: #185FA5;
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .laden {
      text-align: center;
      color: #888780;
      font-size: 14px;
      padding: 2rem 0;
    }

    .fout {
      text-align: center;
      color: #993C1D;
      font-size: 14px;
      padding: 2rem 0;
    }
  </style>
</head>
<body>

<div class="dashboard">
  <h1>Dashboard</h1>
  <p class="subtitle">Urenregistratie systeem</p>

  <h2>🎉 Eerstvolgende feestdagen in Nederland</h2>

  <!-- Hier komen de feestdagen -->
  <ul class="feestdag-lijst" id="feestdagLijst">
    <li class="laden">Feestdagen laden...</li>
  </ul>
</div>

<script src="dashboard.js"></script>

</body>
</html>
